<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B-Anki · 성경 암기 · 교회 헌법 학습</title>
<meta name="description" content="성경 구절 암송, 성경 66권 순서, PCUSA 헌법·규례 학습문제를 간격 반복으로 익히는 웹 앱.">
<meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0c11" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="./styles/app.css">
<script>
  // Resolve the theme before first paint so there is no light-mode flash.
  (function () {
    try {
      var prefs = JSON.parse(localStorage.getItem('banki.v1.prefs') || '{}');
      var choice = prefs.theme || 'auto';
      var dark = choice === 'dark'
        || (choice === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      if (prefs.fontSize) {
        document.documentElement.style.setProperty('--verse-size', prefs.fontSize + 'px');
      }
    } catch (e) {
      document.documentElement.dataset.theme = 'light';
    }
  })();
</script>
</head>
<body>
<main class="shell" id="app" aria-live="polite"></main>
<canvas id="confetti" aria-hidden="true"></canvas>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="./js/app.js"></script>
<noscript>
  <p style="padding:24px;text-align:center">이 앱을 사용하려면 자바스크립트를 켜 주세요.</p>
</noscript>
</body>
</html>
