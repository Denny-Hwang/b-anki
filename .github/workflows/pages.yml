name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'data/**'
      - 'scripts/build_site.py'
      - 'banki/config.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # build_site.py only needs banki/config.py, which is stdlib-only —
      # no dependency install required.
      - name: Build static site
        run: python3 scripts/build_site.py

      # Needs Pages already switched on for the repository
      # (Settings -> Pages -> Source: GitHub Actions). enablement: true was
      # tried and cannot do it: creating a Pages site is beyond what
      # GITHUB_TOKEN can reach, so it fails with "Resource not accessible by
      # integration" instead of the message below, which names the fix.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
